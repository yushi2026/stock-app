function openAddCategoryModal() {
  renderCategoryModal(null);
}
function openEditCategoryModal(id) {
  renderCategoryModal(state.categories.find(c => c.id === id));
}

function renderCategoryModal(editing) {
  const iconKeys = Object.keys(CATEGORY_ICONS);
  openModal(`
    <div class="modal-title">${editing ? 'カテゴリを編集' : 'カテゴリを追加'}</div>
    <form id="cat-form">
      <input type="hidden" name="id" value="${editing ? editing.id : ''}" />
      <div class="form-group">
        <label class="form-label">名前 <span class="req">*</span></label>
        <input class="form-input" name="name" required maxlength="20" value="${editing ? escapeHtml(editing.name) : ''}" placeholder="例: 食品" />
      </div>
      <div class="form-group">
        <label class="form-label">アイコン</label>
        <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;">
          ${iconKeys.map(k => `
            <label style="position:relative;cursor:pointer;">
              <input type="radio" name="icon" value="${k}" ${editing && editing.icon === k ? 'checked' : (!editing && k === 'other' ? 'checked' : '')} style="position:absolute;opacity:0;" />
              <div style="height:44px;border-radius:10px;background:var(--bg-alt);display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid ${(editing && editing.icon === k) || (!editing && k === 'other') ? 'var(--accent)' : 'transparent'};" class="icon-swatch" data-icon="${k}">${CATEGORY_ICONS[k]}</div>
            </label>
          `).join('')}
        </div>
      </div>
      <div style="display:flex;gap:10px;">
        ${editing ? `<button type="button" class="btn-secondary" style="color:var(--danger);" onclick="confirmDeleteCategory('${editing.id}')">削除</button>` : `<button type="button" class="btn-secondary" onclick="closeModal()">キャンセル</button>`}
        <button type="submit" class="btn-primary">${editing ? '更新' : '追加'}</button>
      </div>
    </form>
  `);
  const form = document.getElementById('cat-form');
  form.addEventListener('change', (e) => {
    if (e.target.name === 'icon') {
      form.querySelectorAll('.icon-swatch').forEach(s => {
        s.style.border = s.dataset.icon === e.target.value ? '2px solid var(--accent)' : '2px solid transparent';
      });
    }
  });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const id = fd.get('id') || uid('cat');
    const name = fd.get('name').trim();
    const icon = fd.get('icon') || 'other';
    if (!name) { showToast('名前を入力してください'); return; }
    if (editing) {
      const idx = state.categories.findIndex(c => c.id === id);
      state.categories[idx] = Object.assign({}, editing, { name, icon });
    } else {
      state.categories.push({ id, name, icon, sortOrder: state.categories.length + 1 });
    }
    saveState();
    closeModal();
    showToast(editing ? '更新しました' : '追加しました');
    render();
  });
}

function confirmDeleteCategory(id) {
  const cat = state.categories.find(c => c.id === id);
  const count = state.products.filter(p => p.categoryId === id).length;
  if (count > 0) { showToast(count + '件の商品が紐付いているため削除できません'); return; }
  if (!confirm('カテゴリ「' + cat.name + '」を削除しますか?')) return;
  state.categories = state.categories.filter(c => c.id !== id);
  saveState();
  closeModal();
  showToast('削除しました');
  render();
}

// =============================================================
// === Data Export/Import/Reset ===
// =============================================================

function exportData() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'stock-data-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('エクスポートしました');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!confirm('現在のデータを上書きします。よろしいですか?')) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!imported.products || !imported.categories) { showToast('無効なファイルです'); return; }
        state = imported;
        state.ui = state.ui || {};
        state.ui.currentScreen = 'home';
        if (!state.ui.historyRange) state.ui.historyRange = 'all';
        saveState();
        showToast('インポートしました');
        render();
      } catch (err) {
        showToast('読み込みエラー: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function confirmResetData() {
  if (!confirm('すべてのデータを削除します。\nこの操作は取り消せません。\n本当に実行しますか?')) return;
  if (!confirm('もう一度確認します。本当に削除しますか?')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = createInitialState();
  saveState();
  showToast('削除しました');
  render();
}

// =============================================================
// === Render: History (full log page) ===
// =============================================================

function renderHistory() {
  const filterProductId = state.ui.params.productId || null;
  const filterRange = state.ui.historyRange || 'all';

  let logs = state.stockLogs.slice();
  if (filterProductId) {
    logs = logs.filter(l => l.productId === filterProductId);
  }
  const now = Date.now();
  if (filterRange === '7d') {
    logs = logs.filter(l => now - new Date(l.createdAt).getTime() <= 7 * 86400 * 1000);
  } else if (filterRange === '30d') {
    logs = logs.filter(l => now - new Date(l.createdAt).getTime() <= 30 * 86400 * 1000);
  }

  // Group by day
  const groups = {};
  logs.forEach(l => {
    const d = new Date(l.createdAt);
    const key = d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
    if (!groups[key]) groups[key] = [];
    groups[key].push(l);
  });
  const dayKeys = Object.keys(groups).sort((a, b) => b.localeCompare(a));

  const filteredProduct = filterProductId ? state.products.find(p => p.id === filterProductId) : null;
  const productsWithLogs = state.products.filter(p =>
    state.stockLogs.some(l => l.productId === p.id)
  ).slice().sort((a, b) => a.name.localeCompare(b.name));

  const backTarget = filterProductId
    ? "navigate('detail', { productId: '" + filterProductId + "' })"
    : "navigate('settings')";

  const rangeLabel = filterRange === '7d' ? '(直近7日間)'
    : filterRange === '30d' ? '(直近30日間)'
    : '(全期間)';

  let filterRight;
  if (filterProductId) {
    filterRight = '<button class="cat-tab" onclick="navigate(\'history\', {})" style="background:var(--bg-alt);"><span>✕ 商品フィルタ解除</span></button>';
  } else {
    filterRight = '<select class="form-select" onchange="if(this.value){navigate(\'history\',{productId:this.value})}">'
      + '<option value="">商品で絞り込み</option>'
      + productsWithLogs.map(p => '<option value="' + p.id + '">' + escapeHtml(p.name) + '</option>').join('')
      + '</select>';
  }

  let body;
  if (logs.length === 0) {
    body = `
      <div class="history-empty">
        <div style="font-size:36px;margin-bottom:10px;">📋</div>
        <div style="font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:4px;">履歴がありません</div>
        <div style="font-size:11px;">在庫を増減すると、ここに記録されます</div>
      </div>
    `;
  } else {
    body = dayKeys.map(day => `
      <div class="history-day-section">
        <div class="history-day-head">${day} (${groups[day].length}件)</div>
        ${groups[day].map(l => renderHistoryCard(l)).join('')}
      </div>
    `).join('');
  }

  return `
    <div class="page-header">
      <button class="back" onclick="${backTarget}">←</button>
      <span class="title">操作履歴</span>
      <span style="width:30px;"></span>
    </div>
    <div style="padding:0 20px 4px;">
      <h2 class="serif" style="font-size:24px;margin-bottom:4px;">${filteredProduct ? escapeHtml(filteredProduct.name) : 'すべての履歴'}</h2>
      <div style="font-size:11px;color:var(--text-4);margin-bottom:10px;">
        ${logs.length}件 ${rangeLabel}
      </div>
    </div>
    <div class="history-filter-bar">
      <button class="cat-tab ${filterRange === 'all' ? 'active' : ''}" onclick="setHistoryRange('all')"><span>全期間</span></button>
      <button class="cat-tab ${filterRange === '30d' ? 'active' : ''}" onclick="setHistoryRange('30d')"><span>30日</span></button>
      <button class="cat-tab ${filterRange === '7d' ? 'active' : ''}" onclick="setHistoryRange('7d')"><span>7日</span></button>
      ${filterRight}
    </div>
    ${body}
    ${renderBottomNav('settings')}
  `;
}

function setHistoryRange(range) {
  state.ui.historyRange = range;
  saveState();
  render();
}

function renderHistoryCard(log) {
  const product = state.products.find(p => p.id === log.productId);
  const productName = product ? product.name : '(削除済み商品)';
  const subUnit = product ? (product.hasNested ? product.subUnit : product.unit) : '';
  const mainUnit = product ? product.unit : '';

  let icon = '📝';
  let iconClass = 'adjust';
  let changeText = '';

  if (log.operation === 'consume_sub') {
    icon = '−';
    iconClass = 'consume';
    changeText = '−1' + subUnit + ' 消費';
  } else if (log.operation === 'refill_unit') {
    icon = '+';
    iconClass = 'refill';
    changeText = '+' + Math.abs(log.deltaUnit) + mainUnit + ' 補充';
  } else if (log.operation === 'open_unit') {
    icon = '📦';
    iconClass = 'open';
    changeText = mainUnit + 'を開封 (' + (product ? product.subUnitsPerUnit : '?') + subUnit + 'に)';
  } else if (log.operation === 'adjust') {
    icon = '✏️';
    iconClass = 'adjust';
    if (log.deltaUnit !== 0 && log.deltaSub !== 0) {
      changeText = '残量を調整 (' + log.deltaUnit + mainUnit + ' / ' + log.deltaSub + subUnit + ')';
    } else if (log.deltaSub !== 0) {
      changeText = (log.deltaSub > 0 ? '+' : '') + log.deltaSub + subUnit + ' 調整';
    } else {
      changeText = (log.deltaUnit > 0 ? '+' : '') + log.deltaUnit + mainUnit + ' 調整';
    }
  }

  const time = new Date(log.createdAt);
  const timeStr = String(time.getHours()).padStart(2, '0') + ':' + String(time.getMinutes()).padStart(2, '0');
  const onClickAttr = product ? "navigate('detail',{productId:'" + product.id + "'})" : '';

  return `
    <button class="history-card" onclick="${onClickAttr}" style="${product ? 'cursor:pointer;' : 'cursor:default;'}">
      <div class="icon-wrap ${iconClass}">${icon}</div>
      <div class="body">
        <div class="row1">
          <div class="prod-name">${escapeHtml(productName)}</div>
          <div class="time">${timeStr}</div>
        </div>
        <div class="change-text">${escapeHtml(changeText)}</div>
        ${log.note ? `<div class="note">📝 ${escapeHtml(log.note)}</div>` : ''}
      </div>
    </button>
  `;
}

// =============================================================
// === Bottom Nav ===
// =============================================================

function renderBottomNav(active) {
  const unread = getUnreadNotifCount();
  const shopCount = getActiveShoppingCount();
  return `
    <nav class="bottom-nav">
      <button class="nav-btn ${active === 'home' ? 'active' : ''}" onclick="navigate('home')">
        <span class="icon" style="font-size:20px;">🏠</span>
        <span class="label">在庫</span>
      </button>
      <button class="nav-btn ${active === 'cart' ? 'active' : ''}" onclick="navigate('shopping')">
        <span class="icon" style="font-size:20px;position:relative;">🛒${shopCount > 0 ? '<span style="position:absolute;top:-4px;right:-8px;background:var(--danger);color:white;font-size:9px;min-width:14px;height:14px;border-radius:7px;padding:0 3px;display:inline-flex;align-items:center;justify-content:center;">' + shopCount + '</span>' : ''}</span>
        <span class="label">買い物</span>
      </button>
      <button class="nav-btn center" onclick="navigate('add')">
        <span class="icon-wrap"><span style="color:white;font-size:24px;font-weight:700;">+</span></span>
        <span class="label" style="margin-top:2px;">追加</span>
      </button>
      <button class="nav-btn ${active === 'bell' ? 'active' : ''}" onclick="navigate('notifications')">
        <span class="icon" style="font-size:20px;position:relative;">🔔${unread > 0 ? '<span style="position:absolute;top:-4px;right:-8px;background:var(--danger);color:white;font-size:9px;min-width:14px;height:14px;border-radius:7px;padding:0 3px;display:inline-flex;align-items:center;justify-content:center;">' + unread + '</span>' : ''}</span>
        <span class="label">通知</span>
      </button>
      <button class="nav-btn ${active === 'settings' ? 'active' : ''}" onclick="navigate('settings')">
        <span class="icon" style="font-size:20px;">⚙️</span>
        <span class="label">設定</span>
      </button>
    </nav>
  `;
}

// =============================================================
// === Main render ===
// =============================================================

function render() {
  const app = document.getElementById('app');
  let html = '';
  switch (state.ui.currentScreen) {
    case 'onboarding': html = USE_SUPABASE ? renderAuth() : renderOnboarding(); break;
    case 'auth': html = renderAuth(); break;
    case 'signup': html = renderSignup(); break;
    case 'auth-check-email': html = renderCheckEmail(); break;
    case 'household-setup': html = renderHouseholdSetup(); break;
    case 'home': html = renderHome(); break;
    case 'detail': html = renderDetail(); break;
    case 'add': html = renderAdd(); break;
    case 'shopping': html = renderShopping(); break;
    case 'notifications': html = renderNotifications(); break;
    case 'settings': html = renderSettings(); break;
    case 'categories': html = renderCategories(); break;
    case 'history': html = renderHistory(); break;
    default: html = renderHome();
  }
  app.innerHTML = html;
  if (state.ui.currentScreen === 'onboarding' && !USE_SUPABASE) attachOnboardingHandlers();
  if (state.ui.currentScreen === 'auth' || (state.ui.currentScreen === 'onboarding' && USE_SUPABASE)) attachAuthHandlers('auth');
  if (state.ui.currentScreen === 'signup') attachAuthHandlers('signup');
  if (state.ui.currentScreen === 'settings' && USE_SUPABASE) {
    fetchInviteCode().then((code) => {
      const el = document.getElementById('invite-code-value');
      if (el) el.textContent = code || '未取得';
    });
  }
  if (state.ui.currentScreen === 'household-setup') {
    const c = document.getElementById('household-create-form');
    const j = document.getElementById('household-join-form');
    if (c) c.addEventListener('submit', async (e)=>{
      e.preventDefault();
      if (!supabase) { showToast('Supabaseキー未設定です'); return; }
      const name=(new FormData(c)).get('name');
      const {data,error}=await supabase.rpc('create_household',{name});
      if(error){showToast(error.message);return;}
      householdId=data;
      await bootstrapAfterLogin();
    });
    if (j) j.addEventListener('submit', async (e)=>{
      e.preventDefault();
      if (!supabase) { showToast('Supabaseキー未設定です'); return; }
      const code=(new FormData(j)).get('code');
      const {error}=await supabase.rpc('join_household_by_invite',{invite_code:code});
      if(error){showToast(error.message);return;}
      await bootstrapAfterLogin();
    });
  }
}

  const samples = [
    { name: 'シーバ デュオ シーフード', categoryId: 'cat_pet', hasNested: true, unit: 'ケース', subUnit: '箱', subUnitsPerUnit: 12, maxTotal: 24, alertThreshold: 4, notes: '200g × 12箱入り\n定期おトク便で月1配送', sealed: 0, opened: 8, expiry: '2027-04-21' },
    { name: 'ピュリナ ワン サーモン&ツナ', categoryId: 'cat_pet', hasNested: true, unit: '箱', subUnit: '袋', subUnitsPerUnit: 10, maxTotal: 30, alertThreshold: 5, notes: '440g × 10袋\nしまう場所: パントリー上段', sealed: 0, opened: 1, expiry: '2027-02-15' },
    { name: 'ムーニー パンツ M', categoryId: 'cat_baby', hasNested: false, unit: '袋', subUnit: null, subUnitsPerUnit: null, maxTotal: 6, alertThreshold: 2, notes: '68枚入り', sealed: 2, opened: 0, expiry: null },
    { name: 'はいはい 粉ミルク', categoryId: 'cat_baby', hasNested: false, unit: '缶', subUnit: null, subUnitsPerUnit: null, maxTotal: 5, alertThreshold: 1, notes: '810g', sealed: 3, opened: 0, expiry: '2026-08-15' },
    { name: 'エリエール 消臭+ 12R', categoryId: 'cat_daily', hasNested: true, unit: 'パック', subUnit: 'ロール', subUnitsPerUnit: 12, maxTotal: 96, alertThreshold: 12, notes: '1.5倍巻き', sealed: 5, opened: 0, expiry: null },
  ];
  samples.forEach(s => {
    const id = uid('prod');
    state.products.push({
      id, name: s.name, categoryId: s.categoryId, janCode: null,
      hasNested: s.hasNested, unit: s.unit, subUnit: s.subUnit,
      subUnitsPerUnit: s.subUnitsPerUnit, maxTotal: s.maxTotal,
      alertThreshold: s.alertThreshold, notes: s.notes,
      pinned: false,
      createdAt: new Date().toISOString(),
    });
    state.inventory[id] = {
      sealedCount: s.sealed, openedSubCount: s.opened,
      nearestExpiry: s.expiry, lastUpdatedAt: new Date().toISOString()
    };
    logStock(id, 'adjust', s.sealed, s.opened, 'manual', 'サンプルデータ');
    checkAlerts(id);
  });
  saveState();
  render();
  showToast('サンプル商品を追加しました');
}

// === Initialize ===
initSupabase();
state = loadState() || createInitialState();
if (USE_SUPABASE) { state.ui.currentScreen = 'onboarding'; }
render();
if (USE_SUPABASE && supabase) { supabase.auth.getUser().then(({data})=>{ authUser=data.user; if (authUser) bootstrapAfterLogin(); }); }

// Add sample data prompt for empty new state
if (state.user && state.products.length === 0) {
  setTimeout(() => {
    const homeContainer = document.getElementById('home-cards-container');
    if (homeContainer && state.products.length === 0) {
      const empty = homeContainer.querySelector('.empty');
      if (empty && !empty.querySelector('.sample-btn')) {
        const btn = document.createElement('button');
        btn.className = 'btn-secondary sample-btn';
        btn.textContent = '✨ サンプル商品を追加してみる';
        btn.style.maxWidth = '280px';
        btn.style.margin = '0 auto';
        btn.onclick = loadSampleData;
        empty.appendChild(btn);
      }
    }
  }, 100);
}
